<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="t d">
  <title id="t">A payment leaving a phone, rising through Altude's sponsored relay, and arriving confirmed</title>
  <desc id="d">A phone shows a 24 dollar USDC amount. A single unbroken line rises from it across the frame, passing three chevron waypoints, and ends at a green confirmation tick. Beneath the line, dimmed contour lines and a label read: network fee sponsored by Altude.</desc>

