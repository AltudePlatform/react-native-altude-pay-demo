name: Altude SDK boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
      - run: npm ci
      - run: npm run check:altude-sdk-boundary
      - run: npm test -- --runInBand __tests__/altudeSdkBoundary.test.js
